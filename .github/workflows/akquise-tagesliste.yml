# Jeden Morgen (Mo–Fr, ca. 7:40 Uhr): neue Betriebe suchen, KI-Nachrichten vorschreiben, Tagesliste per E-Mail.
# Verschickt nichts an Betriebe – das Senden macht der Inhaber selbst (Admin → Akquise).
name: Akquise-Tagesliste
on:
  schedule:
    - cron: "41 6 * * 1-5"
  workflow_dispatch:
jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - name: Betriebe suchen (bis zu 4 Branchen/Städte)
        run: |
          for i in 1 2 3 4; do
            curl -sS --max-time 95 "https://ps-professional-solutions.de/api/prospects?action=daily-cron&step=search" || true
            echo
          done
      - name: Nachrichten schreiben
        run: curl -sS --fail-with-body --max-time 95 "https://ps-professional-solutions.de/api/prospects?action=daily-cron&step=write"
      - name: Tagesliste per E-Mail
        run: curl -sS --fail-with-body --max-time 60 "https://ps-professional-solutions.de/api/prospects?action=daily-cron&step=mail"
