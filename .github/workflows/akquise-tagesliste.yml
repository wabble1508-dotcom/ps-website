# Jeden Morgen (Mo–Fr, ca. 7:40 Uhr): neue Betriebe suchen, KI-Nachrichten vorschreiben, Tagesliste per E-Mail.
# Verschickt nichts an Betriebe – das Senden macht der Inhaber selbst (Admin → Akquise).
name: Akquise-Tagesliste
on:
  schedule:
    - cron: "41 6 * * 1-5"
  workflow_dispatch:
jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --fail-with-body --max-time 600 "https://ps-professional-solutions.de/api/prospects?action=daily-cron"
