# ABGESCHALTET (18.11.2026): läuft nicht mehr automatisch, um Claude-Kosten zu sparen. Manuell startbar unter GitHub → Actions → „Run workflow“.
# Automatische E-Mails (nur an Interessenten mit Zustimmung): mehrmals täglich fällige E-Mails verschicken.
name: Automatische E-Mails
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --fail-with-body --max-time 95 "https://ps-professional-solutions.de/api/prospects?action=daily-cron&step=emails"
