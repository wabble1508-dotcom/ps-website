# ABGESCHALTET (18.11.2026): läuft nicht mehr automatisch, um Claude-Kosten zu sparen. Manuell startbar unter GitHub → Actions → „Run workflow“.
# Jeden Sonntag gegen 17 Uhr: KI plant die Content-Woche (Ergebnis per E-Mail + im Admin-Bereich unter „Anfragen“).
# Die Website plant nur, wenn der letzte Plan älter als 6 Tage ist – zweimal laufen schadet nicht.
name: Content-Woche planen
on:
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --fail-with-body --max-time 280 "https://ps-professional-solutions.de/api/social-ai?action=week-cron"
      - run: curl -sS --fail-with-body --max-time 95 "https://ps-professional-solutions.de/api/prospects?action=daily-cron&step=article"
